<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة الشرف · تدريب نافس</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e3b2a;--bg2:#145238;--ink:#fffaf0;--muted:#cfe3d6;--gold:#e8c45a;--gold2:#b8902c;--silver:#d4dae0;--bronze:#d39a68;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.16);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;font-family:"Noto Kufi Arabic",Tahoma,"Segoe UI",sans-serif;color:var(--ink);
  background:radial-gradient(1200px 600px at 50% -10%,#1d6b48 0%,transparent 60%),linear-gradient(180deg,var(--bg2),var(--bg))}
html{background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto;padding:22px 16px 40px}
header{text-align:center;padding:10px 0 6px;position:relative}
.trophy{font-size:56px;line-height:1;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
h1{margin:6px 0 2px;font-size:clamp(30px,6vw,52px);font-weight:800;color:var(--gold);letter-spacing:.5px;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.sub{font-size:clamp(15px,2.6vw,20px);font-weight:600}
.lesson{color:var(--muted);margin-top:4px;font-size:15px}
.rule{display:flex;align-items:center;gap:12px;justify-content:center;margin:18px 0 12px;color:var(--gold);font-weight:800;font-size:clamp(18px,3vw,24px)}
.rule:before,.rule:after{content:"";height:2px;flex:1;max-width:220px;background:linear-gradient(90deg,transparent,var(--gold))}
.rule:after{background:linear-gradient(270deg,transparent,var(--gold))}
/* المنصة */
.podium{display:flex;justify-content:center;align-items:flex-end;gap:12px;flex-wrap:nowrap;margin:8px 0 6px}
.pl{flex:1;max-width:230px;text-align:center;display:flex;flex-direction:column;align-items:center}
.pl .who{font-weight:800;font-size:clamp(14px,2.4vw,19px);line-height:1.5;margin-bottom:6px;word-break:break-word}
.pl .cl{font-size:13px;color:var(--muted);font-weight:400}
.pl .sc{display:inline-block;margin-top:4px;background:rgba(0,0,0,.25);border-radius:999px;padding:1px 10px;font-size:13px}
.step{width:100%;border-radius:14px 14px 4px 4px;display:flex;align-items:flex-start;justify-content:center;padding-top:10px;font-size:34px;font-weight:800;color:#3a2a06;box-shadow:inset 0 -8px 0 rgba(0,0,0,.12)}
.r1 .step{height:150px;background:linear-gradient(180deg,#f6dc85,var(--gold2))}
.r2 .step{height:110px;background:linear-gradient(180deg,#eef1f4,#9aa4ad)}
.r3 .step{height:84px;background:linear-gradient(180deg,#ecc195,#a8693a)}
.medal{font-size:34px;margin-bottom:2px}
.more{max-width:620px;margin:12px auto 0;display:grid;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.rk{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:rgba(232,196,90,.18);color:var(--gold);font-weight:800}
.row .nm{font-weight:600;flex:1}
.row .cl{color:var(--muted);font-size:13px}
.row .sc{font-weight:800;color:var(--gold)}
/* الفصول */
.classes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.cls{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 14px 12px;break-inside:avoid}
.cls h3{margin:0 0 10px;text-align:center;font-size:20px;color:var(--gold)}
.cls h3 small{display:block;color:var(--muted);font-size:12.5px;font-weight:400}
.cls ol{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.cls li{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.18);border-radius:10px;padding:8px 10px}
.cls li .m{font-size:22px;width:28px;text-align:center}
.cls li .nm{flex:1;font-weight:600}
.cls li .sc{font-weight:800;color:var(--gold);font-size:14px}
.imp{margin-top:10px;border:1px dashed var(--gold);border-radius:10px;padding:8px 10px;font-size:14px;text-align:center}
.imp b{color:var(--gold)}
.cmp{max-width:720px;margin:0 auto;display:grid;gap:10px}
.cc{display:grid;grid-template-columns:44px 1fr auto;gap:4px 12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.cc .m{font-size:30px;grid-row:span 2;text-align:center}
.cc .nm{font-weight:800;font-size:19px}
.cc .ix{font-weight:800;font-size:24px;color:var(--gold);grid-row:span 2}
.cc .det{font-size:13px;color:var(--muted);grid-column:2}
.cc .bar{grid-column:1/-1;height:8px;border-radius:99px;background:rgba(0,0,0,.25);overflow:hidden}.cc .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold))}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0 2px}
.tabs a{color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:14px;background:var(--card)}
.empty{color:var(--muted);text-align:center;font-size:14px;padding:8px}
.msg{max-width:560px;margin:40px auto;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;line-height:1.9}
footer{text-align:center;margin-top:26px;color:var(--muted);font-size:13.5px;line-height:1.9}
footer .proud{color:var(--ink);font-size:clamp(16px,2.6vw,20px);font-weight:600}
.tools{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;border:0;border-radius:999px;padding:9px 20px;cursor:pointer;background:var(--gold);color:#2b2006}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.demo{background:#7a3e14;color:#fff;text-align:center;padding:6px;border-radius:10px;font-size:13px;margin-bottom:10px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:5}
@media (max-width:520px){.podium{gap:6px}.r1 .step{height:120px}.r2 .step{height:90px}.r3 .step{height:70px}.step{font-size:26px}.medal{font-size:26px}}
@media print{@page{size:A4 portrait;margin:10mm}
  body{background:#0e3b2a!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tools,#confetti{display:none!important}.wrap{padding:0}}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="wrap" id="app"><div class="msg">جارٍ تحميل لوحة الشرف…</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(function(){
const P=new URLSearchParams(location.search),lesson=P.get("l")||"cells6",app=document.getElementById("app");
const AR="٠١٢٣٤٥٦٧٨٩",ar=v=>String(v).replace(/\d/g,d=>AR[d]);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clsName=c=>"فصل "+esc(c);
const medal=r=>r===1?"🥇":r===2?"🥈":r===3?"🥉":"⭐";
const pc=v=>v==null?"":ar(v)+"٪";

function draw(B,demo){
  const g=B.grade||[],first=g.filter(x=>x.rank===1),second=g.filter(x=>x.rank===2),third=g.filter(x=>x.rank===3),rest=g.filter(x=>x.rank>3);
  const names=a=>a.map(x=>'<div>'+esc(x.name)+' <span class="cl">· '+clsName(x.cls)+'</span></div>').join("");
  const place=(a,r)=>a.length?'<div class="pl r'+r+'"><div class="medal">'+medal(r)+'</div><div class="who">'+names(a)+(B.showPct&&a[0].pct!=null?'<span class="sc">'+pc(a[0].pct)+'</span>':'')+'</div><div class="step">'+ar(r)+'</div></div>':'';
  let when="";try{const d=B.at&&B.at.toDate?B.at.toDate():B.at?new Date(B.at):null;if(d)when=d.toLocaleDateString("ar-SA-u-ca-islamic-umalqura",{day:"numeric",month:"long",year:"numeric"})}catch(e){}
  app.innerHTML=(demo?'<div class="demo">نسخة تجريبية بأسماء مولّدة للعرض فقط</div>':'')+
   '<header><div class="trophy">🏆</div><h1>لوحة الشرف</h1><div class="sub">المتميزون في تدريب «نافس» · العلوم · الصف السادس</div><div class="lesson">'+esc(B.title||"")+(when?' · '+when:'')+'</div></header>'+
   '<nav class="tabs"><a href="#classes">🏫 بين الفصول</a><a href="#lesson">🟢 اختبار الحصة</a><a href="#home">🏠 التدريب المنزلي</a></nav>'+
   '<div class="rule" id="classes">🏫 المنافسة بين الفصول</div>'+
   ((B.cmp||[]).length?'<div class="cmp">'+B.cmp.map(c=>'<div class="cc"><span class="m">'+medal(c.rank)+'</span><span class="nm">'+clsName(c.cls)+'</span><span class="ix">'+ar(c.index)+'</span><span class="det">متوسط الدرجة '+pc(c.avg)+(c.part!=null?' · نسبة المشاركة '+pc(c.part)+' ('+ar(c.n)+' من '+ar(c.total)+')':'')+'</span><span class="bar"><i style="width:'+Math.max(3,c.index)+'%"></i></span></div>').join("")+'</div><p style="text-align:center;color:var(--muted);font-size:13px;margin:8px 0 0">مؤشر الفصل = متوسط درجات الفصل × نسبة مشاركة طلابه</p>':'<div class="empty">لم تكتمل نتائج الفصول بعد.</div>')+
   '<div class="rule" id="lesson">🟢 أبطال اختبار الحصة</div>'+
   (g.length?'<div class="podium">'+place(second,2)+place(first,1)+place(third,3)+'</div>'+
     (rest.length?'<div class="more">'+rest.map(x=>'<div class="row"><span class="rk">'+ar(x.rank)+'</span><span class="nm">'+esc(x.name)+' <span class="cl">· '+clsName(x.cls)+'</span></span>'+(B.showPct&&x.pct!=null?'<span class="sc">'+pc(x.pct)+'</span>':'')+'</div>').join("")+'</div>':'')
    :'<div class="empty">لم تكتمل النتائج بعد.</div>')+
   '<div class="rule">المتميزون في كل فصل</div>'+
   '<div class="classes">'+(B.classes||[]).map(c=>'<section class="cls"><h3>'+clsName(c.cls)+'</h3>'+
      (c.top&&c.top.length?'<ol>'+c.top.map(x=>'<li><span class="m">'+medal(x.rank)+'</span><span class="nm">'+esc(x.name)+'</span>'+(B.showPct&&x.pct!=null?'<span class="sc">'+pc(x.pct)+'</span>':'')+'</li>').join("")+'</ol>':'<div class="empty">لا يوجد متميزون بعد في هذا الفصل.</div>')+
      (c.imp?'<div class="imp">🚀 الأكثر تقدّمًا: <b>'+esc(c.imp.name)+'</b>'+(B.showPct&&c.imp.from!=null?'<br><span style="color:var(--muted);font-size:13px">من '+pc(c.imp.from)+' قبل الدرس إلى '+pc(c.imp.to)+' بعده</span>':'')+'</div>':'')+
     '</section>').join("")+'</div>'+
   '<div class="rule" id="home">🏠 أبطال التدريب المنزلي</div>'+
   ((B.home||[]).length?'<div class="more">'+B.home.map(x=>'<div class="row"><span class="rk">'+(x.rank<=3?medal(x.rank):ar(x.rank))+'</span><span class="nm">'+esc(x.name)+' <span class="cl">· '+clsName(x.cls)+(x.tries?' · المحاولات: '+ar(x.tries):'')+'</span></span>'+(B.showPct&&x.pct!=null?'<span class="sc">'+pc(x.pct)+'</span>':'')+'</div>').join("")+'</div>':'<div class="empty">لم يبدأ التدريب المنزلي بعد.</div>')+
   '<footer><div class="proud">نفخر بكم، ونرجو لكم دوام التميز 🌟</div>لوحة الحصة: محاولة واحدة لكل طالب أثناء الحصة · التدريب المنزلي: أفضل نتيجة في المنزل<br>عند التساوي يتقدّم الأكثر إتقانًا للمستويات الإدراكية.<br>تصميم: أيمن الصاعدي'+
   '<div class="tools"><button class="btn" id="shareBtn">مشاركة اللوحة</button><button class="btn ghost" onclick="print()">طباعة / حفظ PDF</button></div></footer>';
  document.getElementById("shareBtn").onclick=()=>{const u=location.href.split("#")[0].replace(/[?&](preview|demo)=1/,"");if(navigator.share)navigator.share({title:"لوحة الشرف · تدريب نافس",url:u}).catch(()=>{});else{navigator.clipboard&&navigator.clipboard.writeText(u);document.getElementById("shareBtn").textContent="✓ نُسخ الرابط"}};
  confetti();
}

function confetti(){const c=document.getElementById("confetti"),x=c.getContext("2d");if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const W=c.width=innerWidth,H=c.height=innerHeight,cols=["#e8c45a","#fff3c4","#7fd1a0","#f2a65a","#ffffff"];
  const ps=Array.from({length:140},()=>({x:Math.random()*W,y:-Math.random()*H,r:4+Math.random()*5,v:2+Math.random()*3,a:Math.random()*6,s:.05+Math.random()*.1,c:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0;(function f(){x.clearRect(0,0,W,H);ps.forEach(p=>{p.y+=p.v;p.x+=Math.sin(p.a+=p.s)*1.2;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});if(++t<260)requestAnimationFrame(f);else x.clearRect(0,0,W,H)})()}

function demoBoard(){const n=[["سارة","6أ",100],["لتين","6ب",100],["جود","6ج",92],["ريم","6أ",92],["هيا","6ب",83],["شهد","6ج",83],["نورة","6أ",75],["دانة","6ب",75],["تالا","6ج",75]];
  const R=n.map(a=>({name:a[0],cls:a[1],pct:a[2]})),rk=a=>{let r=0,p=null;return a.map((x,i)=>{if(x.pct!==p)r++;p=x.pct;return Object.assign({rank:r},x)})};
  return {title:"الخلية النباتية والخلية الحيوانية",at:new Date(),showPct:true,grade:rk(R).filter(x=>x.rank<=5),
    classes:["6أ","6ب","6ج"].map((c,i)=>({cls:c,top:rk(R.filter(x=>x.cls===c)),imp:{name:["غلا","وعد","لمى"][i],from:[17,33,25][i],to:[67,75,58][i]}})),
    cmp:[{cls:"6ب",rank:1,index:76,avg:82,part:92,n:23,total:25},{cls:"6أ",rank:2,index:71,avg:79,part:90,n:27,total:30},{cls:"6ج",rank:3,index:64,avg:80,part:80,n:20,total:25}],
    home:[{name:"رهف",cls:"6ج",pct:100,rank:1,tries:4},{name:"جود",cls:"6ج",pct:100,rank:1,tries:2},{name:"مها",cls:"6أ",pct:92,rank:2,tries:5},{name:"بيان",cls:"6ب",pct:83,rank:3,tries:3},{name:"أروى",cls:"6أ",pct:75,rank:4,tries:2}]}}

if(P.get("demo")==="1"){draw(demoBoard(),true);return}
if(P.get("preview")==="1"){try{const B=JSON.parse(localStorage.getItem("durus_honor_preview")||"null");if(B){draw(B,false);return}}catch(e){}}
if(!(window.DURUS_FB&&window.DURUS_FB.apiKey&&window.firebase)){app.innerHTML='<div class="msg">لوحة الشرف غير متاحة الآن. يرجى المحاولة لاحقًا.</div>';return}
firebase.initializeApp(window.DURUS_FB);
firebase.firestore().collection("durus_honor").doc(lesson).onSnapshot(d=>{
  if(!d.exists){app.innerHTML='<div class="msg">🏆<br>لم تُنشر لوحة الشرف لهذا الدرس بعد.<br>ترقّبوها قريبًا!</div>';return}
  draw(d.data(),false)},()=>{app.innerHTML='<div class="msg">تعذّر تحميل لوحة الشرف. تحقّق من اتصالك ثم أعد المحاولة.</div>'});
})();
</script>
</body>
</html>

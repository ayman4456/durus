<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة الشرف — «مِجهر»</title>
<meta property="og:title" content="🏆 لوحة الشرف — منصة «مِجهر»">
<meta property="og:description" content="المتميزون في تحدي «نافس» الصفي والتدريب المنزلي · العلوم · الصف السادس">
<meta name="description" content="لوحة الشرف لمنصة «مِجهر»: المتميزون في تحدي «نافس» الصفي والتدريب المنزلي.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#183a32;--teal:#2f8f73;--gold:#e0b44a;--bg:#f4f7f5;--card:#fff;--ink:#14231d;--ink2:#2d5246;--line:#dde7e2;color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1c18;--card:#17271f;--ink:#f3f8f5;--ink2:#cfe5da;--line:#2b4237;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1c18;--card:#17271f;--ink:#f3f8f5;--ink2:#cfe5da;--line:#2b4237;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Cairo",Tahoma,sans-serif;font-weight:800;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.hero{background:radial-gradient(120% 90% at 50% 0%,#2f8f73 0%,#183a32 70%);color:#fff;text-align:center;padding:22px 16px 70px;border-bottom-left-radius:40px;border-bottom-right-radius:40px}
.hero .cup{font-size:56px;line-height:1}
.hero h1{margin:4px 0 0;font-size:clamp(30px,8vw,46px);font-weight:900;color:#ffe08a}
.hero .sub{font-size:16px;color:#e6f4ee}
.hero select{margin-top:10px;font:inherit;font-weight:900;border:0;border-radius:14px;padding:8px 14px;background:#fff;color:#183a32;max-width:92vw}
.hero .when{font-size:14px;color:#cfe8dd;margin-top:6px}
.wrap{max-width:820px;margin:-50px auto 0;padding:0 12px 30px;position:relative}
.demo{background:#fff4d6;color:#6b4a00;border:1px solid #e8c56a;border-radius:12px;padding:6px 10px;margin-bottom:10px;text-align:center}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px;box-shadow:0 8px 20px rgba(0,0,0,.08);margin-bottom:12px}
.tabs button{flex:1;border:0;border-radius:13px;padding:9px 4px;font:inherit;font-weight:900;font-size:15px;background:transparent;color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--teal);color:#fff}
.sec{display:none}.sec.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;margin-bottom:12px;box-shadow:0 4px 14px rgba(0,0,0,.04)}
.h{font-size:19px;font-weight:900;margin:0 0 8px}
.note{color:var(--ink2);font-size:14px;margin:6px 0 0;text-align:center}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;margin:6px 0 4px}
.pl{text-align:center}
.av{width:62px;height:62px;border-radius:50%;margin:0 auto 4px;display:grid;place-items:center;font-size:26px;font-weight:900;color:#fff;box-shadow:0 6px 14px rgba(0,0,0,.18);position:relative}
.pl.r1 .av{width:78px;height:78px;font-size:32px;background:linear-gradient(160deg,#ffd76a,#e0a92a)}
.pl.r2 .av{background:linear-gradient(160deg,#dfe6ec,#9fb0bd)}.pl.r3 .av{background:linear-gradient(160deg,#f0b98a,#c27a45)}
.av .md{position:absolute;bottom:-6px;left:-4px;font-size:24px}
.pl .nm{font-size:15px;line-height:1.4}.pl .cl{display:block;font-size:12.5px;color:var(--ink2)}
.pl .sc{display:inline-block;margin-top:2px;background:var(--teal);color:#fff;border-radius:99px;padding:0 10px;font-size:13px}
.step{margin-top:6px;border-radius:14px 14px 4px 4px;color:#fff;font-size:24px;font-weight:900;display:grid;place-items:center}
.r1 .step{height:96px;background:linear-gradient(180deg,#e9bf4f,#c99a2e)}.r2 .step{height:70px;background:linear-gradient(180deg,#aebcc8,#8697a5)}.r3 .step{height:52px;background:linear-gradient(180deg,#d69564,#b06a38)}
.list .it{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid var(--line)}.list .it:last-child{border-bottom:0}
.rk{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--teal) 14%,transparent);color:var(--ink);font-weight:900}
.list .nm{flex:1}.list .nm small{display:block;color:var(--ink2);font-size:12.5px}
.badge{background:var(--teal);color:#fff;border-radius:99px;padding:0 10px;font-size:13px;white-space:nowrap}
.race .rc{padding:10px 4px;border-bottom:1px solid var(--line)}.race .rc:last-child{border-bottom:0}
.race .top{display:flex;align-items:center;gap:10px}
.race .md{font-size:28px}.race .nm{flex:1;font-size:18px}.race .ix{font-size:26px;font-weight:900;color:var(--teal)}
.race .bar{height:14px;border-radius:99px;background:color-mix(in srgb,var(--gold) 18%,transparent);overflow:hidden;margin:6px 0 2px}
.race .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#e0b44a,#2f8f73);width:0;transition:width 1.2s ease}
.race .det{font-size:13px;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.cls h3{margin:0 0 4px;font-size:18px;color:var(--teal)}
.imp{margin-top:8px;background:color-mix(in srgb,var(--gold) 16%,transparent);border-radius:12px;padding:6px 10px;font-size:14px}
.empty{text-align:center;color:var(--ink2);padding:14px}
.foot{text-align:center;font-size:13.5px;color:var(--ink2);margin-top:6px}
.foot .proud{font-size:17px;color:var(--ink);margin-bottom:4px}
.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.btn{border:0;border-radius:14px;padding:10px 18px;font:inherit;font-weight:900;cursor:pointer;background:var(--gold);color:#2a1f00}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.msg{text-align:center;padding:40px 16px;font-size:18px}
@media print{.tabs,.tools,#confetti{display:none!important}.sec{display:block!important}.wrap{margin-top:10px}}
@media (prefers-reduced-motion: reduce){.race .bar i{transition:none}}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div id="app"><div class="msg">جارٍ تحميل لوحة الشرف…</div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(function(){
const P=new URLSearchParams(location.search),lesson=P.get("l")||"cells6",app=document.getElementById("app");
const AR="٠١٢٣٤٥٦٧٨٩",ar=v=>String(v).replace(/\d/g,d=>AR[d]);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LESSONS=[["cells6","الخلية النباتية والخلية الحيوانية"],["heredity6","الوراثة والصفات"],["plants6","عمليات الحياة في النباتات"],["microbes6","المخلوقات الحية الدقيقة"],["digestion6","الهضم والإخراج والتنفس والدوران"],["foodchain6","السلاسل والشبكات الغذائية وهرم الطاقة"],["ecosys6","مقارنة الأنظمة البيئية"],["resources6","موارد الأرض والحفاظ عليها"]];
const medal=r=>r===1?"🥇":r===2?"🥈":r===3?"🥉":"⭐";
const pc=v=>v==null?"":ar(v)+"٪";
const ini=n=>esc(String(n||"؟").trim().charAt(0));
const cn=c=>"فصل "+esc(c);
/* رابط مشاركة نظيف: يحذف معاملات المعاينة والتجربة دون أن يُفسد بقية الرابط */
function shareUrl(){const u=new URL(location.href);u.searchParams.delete("preview");u.searchParams.delete("demo");u.hash="";if(!u.searchParams.get("l"))u.searchParams.set("l",lesson);return u.toString()}
function draw(B,demo){
  const g=B.grade||[],by=r=>g.filter(x=>x.rank===r),rest=g.filter(x=>x.rank>3);
  const place=(a,r)=>a.length?'<div class="pl r'+r+'"><div class="av">'+ini(a[0].name)+'<span class="md">'+medal(r)+'</span></div><div class="nm">'+a.map(x=>esc(x.name)+'<span class="cl">'+cn(x.cls)+'</span>').join("")+'</div>'+(B.showPct&&a[0].pct!=null?'<span class="sc">'+pc(a[0].pct)+'</span>':'')+'<div class="step">'+ar(r)+'</div></div>':'<div></div>';
  let when="";try{const d=B.at&&B.at.toDate?B.at.toDate():B.at?new Date(B.at):null;if(d)when=d.toLocaleDateString("ar-SA-u-ca-islamic-umalqura",{day:"numeric",month:"long",year:"numeric"})}catch(e){}
  const item=(x,extra)=>'<div class="it"><span class="rk">'+(x.rank<=3?medal(x.rank):ar(x.rank))+'</span><span class="nm">'+esc(x.name)+'<small>'+cn(x.cls)+(extra||"")+'</small></span>'+(B.showPct&&x.pct!=null?'<span class="badge">'+pc(x.pct)+'</span>':'')+'</div>';
  app.innerHTML='<header class="hero"><div class="cup">🏆</div><h1>لوحة الشرف</h1><div class="sub">المتميزون في «نافس» · العلوم · الصف السادس</div>'+
    '<select id="lsel" aria-label="اختر الدرس">'+LESSONS.map(l=>'<option value="'+l[0]+'"'+(l[0]===lesson?" selected":"")+'>'+l[1]+'</option>').join("")+'</select>'+(when?'<div class="when">آخر تحديث: '+when+'</div>':'')+'</header>'+
   '<div class="wrap">'+(demo?'<div class="demo">نسخة تجريبية بأسماء مولّدة للعرض فقط</div>':'')+
   '<nav class="tabs"><button data-s="s1" class="on">🥇 الأبطال</button><button data-s="s2">🏫 الفصول</button><button data-s="s3">🏠 المنزل</button></nav>'+
   '<section class="sec on" id="s1"><div class="card"><div class="h">🎯 أبطال تحدي «نافس» الصفي</div>'+
     (g.length?'<div class="podium">'+place(by(2),2)+place(by(1),1)+place(by(3),3)+'</div>'+(rest.length?'<div class="list">'+rest.map(x=>item(x)).join("")+'</div>':''):'<div class="empty">لم تكتمل النتائج بعد.</div>')+'</div>'+
     '<div class="card"><div class="h">⭐ المتميزون في كل فصل</div><div class="grid">'+(B.classes||[]).map(c=>'<div class="cls"><h3>'+cn(c.cls)+'</h3>'+(c.top&&c.top.length?'<div class="list">'+c.top.map(x=>item(x)).join("")+'</div>':'<div class="empty">لا يوجد متميزون بعد.</div>')+
       (c.imp?'<div class="imp">🚀 الأكثر تقدّمًا: <b>'+esc(c.imp.name)+'</b>'+(B.showPct&&c.imp.from!=null?'<br><small>من '+pc(c.imp.from)+' إلى '+pc(c.imp.to)+'</small>':'')+'</div>':'')+'</div>').join("")+'</div></div></section>'+
   '<section class="sec" id="s2"><div class="card race"><div class="h">🏫 سباق الفصول</div>'+((B.cmp||[]).length?B.cmp.map(c=>'<div class="rc"><div class="top"><span class="md">'+medal(c.rank)+'</span><span class="nm">'+cn(c.cls)+'</span><span class="ix">'+ar(c.index)+'</span></div><div class="bar"><i data-w="'+Math.max(3,c.index)+'"></i></div><div class="det">متوسط الدرجة '+pc(c.avg)+(c.part!=null?' · المشاركة '+pc(c.part)+' ('+ar(c.n)+' من '+ar(c.total)+')':'')+'</div></div>').join("")+'<p class="note">مؤشر الفصل = متوسط درجات الفصل × نسبة مشاركة طلابه</p>':'<div class="empty">لم تكتمل نتائج الفصول بعد.</div>')+'</div></section>'+
   '<section class="sec" id="s3"><div class="card"><div class="h">🏠 أبطال التدريب المنزلي</div>'+((B.home||[]).length?'<div class="list">'+B.home.map(x=>item(x,x.tries?' · المحاولات: '+ar(x.tries):'')).join("")+'</div>':'<div class="empty">لم يبدأ التدريب المنزلي بعد.</div>')+'</div></section>'+
   '<div class="foot"><div class="proud">نفخر بكم، ونرجو لكم دوام التميز 🌟</div>تحدي «نافس» الصفي: تحدٍّ تدريبي بمحاولة واحدة خلال مدة يحددها المعلم، وليس اختبارًا رسميًا · التدريب المنزلي: أفضل نتيجة في المنزل<br>منصة «مِجهر» · تصميم: أيمن الصاعدي'+
   '<div class="tools"><button class="btn" id="shareBtn">📤 مشاركة اللوحة</button><button class="btn ghost" onclick="print()">🖨️ طباعة / PDF</button></div></div></div>';
  document.getElementById("lsel").onchange=e=>{const u=new URL(location.href);u.searchParams.set("l",e.target.value);u.searchParams.delete("preview");location.href=u.toString()};
  app.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{app.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));app.querySelectorAll(".sec").forEach(s=>s.classList.toggle("on",s.id===b.dataset.s));grow()});
  const sb=document.getElementById("shareBtn");sb.onclick=()=>{const u=shareUrl(),t="🏆 لوحة الشرف — «مِجهر»";
    if(navigator.share)navigator.share({title:t,text:t,url:u}).catch(()=>{});
    else if(navigator.clipboard)navigator.clipboard.writeText(u).then(()=>sb.textContent="✓ نُسخ الرابط").catch(()=>prompt("انسخ الرابط:",u));else prompt("انسخ الرابط:",u)};
  grow();confetti()}
function grow(){setTimeout(()=>app.querySelectorAll(".race .bar i").forEach(i=>i.style.width=i.dataset.w+"%"),80)}
function confetti(){const c=document.getElementById("confetti"),x=c.getContext("2d");if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const W=c.width=innerWidth,H=c.height=innerHeight,cols=["#e0b44a","#fff3c4","#2f8f73","#f2a65a","#9fd8c2"];
  const ps=Array.from({length:120},()=>({x:Math.random()*W,y:-Math.random()*H,r:4+Math.random()*5,v:2+Math.random()*3,a:Math.random()*6,s:.05+Math.random()*.1,c:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0;(function f(){x.clearRect(0,0,W,H);ps.forEach(p=>{p.y+=p.v;p.x+=Math.sin(p.a+=p.s)*1.2;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});if(++t<220)requestAnimationFrame(f);else x.clearRect(0,0,W,H)})()}
function demoBoard(){const n=[["سارة","6/1",100],["لتين","6/2",100],["جود","6/3",92],["ريم","6/1",92],["هيا","6/2",83],["شهد","6/3",83],["نورة","6/1",75],["دانة","6/2",75],["تالا","6/3",75]];
  const R=n.map(a=>({name:a[0],cls:a[1],pct:a[2]})),rk=a=>{let r=0,p=null;return a.map(x=>{if(x.pct!==p)r++;p=x.pct;return Object.assign({rank:r},x)})};
  return {title:"الخلية النباتية والخلية الحيوانية",at:new Date(),showPct:true,grade:rk(R).filter(x=>x.rank<=5),
    classes:["6/1","6/2","6/3"].map((c,i)=>({cls:c,top:rk(R.filter(x=>x.cls===c)),imp:{name:["غلا","وعد","لمى"][i],from:[17,33,25][i],to:[67,75,58][i]}})),
    cmp:[{cls:"6/2",rank:1,index:76,avg:82,part:92,n:23,total:25},{cls:"6/1",rank:2,index:71,avg:79,part:90,n:27,total:30},{cls:"6/3",rank:3,index:64,avg:80,part:80,n:20,total:25}],
    home:[{name:"رهف",cls:"6/3",pct:100,rank:1,tries:4},{name:"جود",cls:"6/3",pct:100,rank:1,tries:2},{name:"مها",cls:"6/1",pct:92,rank:2,tries:5},{name:"بيان",cls:"6/2",pct:83,rank:3,tries:3},{name:"أروى",cls:"6/1",pct:75,rank:4,tries:2}]}}
if(P.get("demo")==="1"){draw(demoBoard(),true);return}
if(P.get("preview")==="1"){try{const B=JSON.parse(localStorage.getItem("durus_honor_preview")||"null");if(B){draw(B,false);return}}catch(e){}}
if(!(window.DURUS_FB&&window.DURUS_FB.apiKey&&window.firebase)){app.innerHTML='<div class="msg">لوحة الشرف غير متاحة الآن. يرجى المحاولة لاحقًا.</div>';return}
try{if(!firebase.apps.length)firebase.initializeApp(window.DURUS_FB)}catch(e){}
firebase.firestore().collection("durus_honor").doc(lesson).onSnapshot(d=>{
  if(!d.exists){app.innerHTML='<div class="msg">🏆<br>لم تُنشر لوحة الشرف لهذا الدرس بعد.<br>ترقّبوها قريبًا!</div>';return}
  draw(d.data(),false)},()=>{app.innerHTML='<div class="msg">تعذّر تحميل لوحة الشرف. تحقّق من اتصالك ثم أعد المحاولة.</div>'});
})();
</script>
</body>
</html>
